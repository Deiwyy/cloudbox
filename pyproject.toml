[project]
name = "cloudbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deiwyy", email = "kaprolekdawidek@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "server-utils",
]

