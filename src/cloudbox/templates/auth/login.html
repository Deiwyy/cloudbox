
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cloudbox</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input,
        button {
            padding: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <h1>Cloudbox</h1>

    <form method="POST" action="/login">
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Log in</button>
    </form>
</body>
</html>
