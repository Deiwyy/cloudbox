{% extends "base.html" %}

{% block title %}Login - Cloudbox{% endblock %}

{% block content %}
<main class="login">
    <form class="login-form panel animate__animated {% if error == 'invalid' %}error{% endif %}" method="POST">

        <h1 class="login-title">Cloudbox</h1>
        <div class="form-group">
            <input
                type="text"
                name="username"
                placeholder="Login"
                required
            >
        </div>

        <div class="form-group">
            <input
                type="password"
                name="password"
                placeholder="Hasło"
                required
            >
        </div>

        <button type="submit">
            Zaloguj sie
        </button>

    </form>
</main>
{% endblock %}
